<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <rect width="960" height="960" fill="#ffffff"/>
  <defs>
    <pattern id="checks" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#1f1f1f"/>
      <rect x="60" width="60" height="60" fill="#ffffff"/>
      <rect y="60" width="60" height="60" fill="#ffffff"/>
      <rect x="60" y="60" width="60" height="60" fill="#1f1f1f"/>
    </pattern>
  </defs>
  <rect width="960" height="960" fill="url(#checks)"/>
  <g opacity="0.9">
    <rect x="0" y="420" width="960" height="120" fill="#594ff4"/>
    <rect x="420" y="0" width="120" height="960" fill="#594ff4"/>
  </g>
  <g>
    <rect x="120" y="120" width="240" height="240" fill="#ffffff"/>
    <rect x="150" y="150" width="180" height="180" fill="#594ff4"/>
    <rect x="600" y="120" width="240" height="240" fill="#1f1f1f"/>
    <rect x="630" y="150" width="180" height="180" fill="#ffffff"/>
    <rect x="120" y="600" width="240" height="240" fill="#1f1f1f"/>
    <rect x="150" y="630" width="180" height="180" fill="#ffb703"/>
    <rect x="600" y="600" width="240" height="240" fill="#ffffff"/>
    <rect x="630" y="630" width="180" height="180" fill="#1f1f1f"/>
  </g>
  <g stroke="#1f1f1f" stroke-width="6">
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="0" y1="720" x2="960" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
    <line x1="720" y1="0" x2="720" y2="960"/>
  </g>
</svg>
